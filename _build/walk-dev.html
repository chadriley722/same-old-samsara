<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>the walk · dev</title><meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#fff4d9;overflow:hidden}canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#hud{position:fixed;left:8px;bottom:8px;font:12px/1.3 monospace;background:#fffc;padding:4px 6px;color:#333;white-space:pre}</style></head>
<body><canvas id="c"></canvas><div id="hud"></div>
<!-- A workbench for the world on its own, without the page around it. Lives in _build, so it never goes live.
     Open it through the preview server: http://127.0.0.1:8811/_build/walk-dev.html
     ?u=3.5 where on the walk · ?night=1 the walk that starts in the dark · ?tier=0..2 · ?t=12 freeze the clock
     arrow keys walk, n flips night, drag looks around.
     ?shoot=1 saves the still prints the plain page uses (needs _build/serve.py --shots <folder>).
     ?shoot=og&w=2400&h=1260 saves the scene for the share picture. -->
<script type="module">
import { World, STOP_IDS } from "../walk/world.js";
const q = new URLSearchParams(location.search), num = (k, d) => (q.has(k) ? +q.get(k) : d);
const hud = document.getElementById("hud"), canvas = document.getElementById("c");
let world;
try { world = new World(canvas, { tier: num("tier", 2), capture: true }); } catch (e) { hud.textContent = "ERROR " + e.message; throw e; }
window.world = world;
const S = { u: num("u", 0), night: num("night", 0), head: [num("yaw", 0), num("pitch", 0)], gust: 0, time: num("t", 3), moonPhase: num("moon", 0.62) };
window.S = S;

if (q.has("shoot")) {
  // each stop as a 1600 x 1000 picture. the gate keeps the framing the live page uses, so it can stand in while the world loads.
  let shots = STOP_IDS.map((id, i) => ({ name: i + "-" + id, u: i, night: 0, slide: i === 0 ? 1 : 0 }));
  shots.push({ name: "0-gate-night", u: 0, night: 1, slide: 1 });
  if (q.get("shoot") === "og") shots = [{ name: "og-scene", u: 0, night: 0, slide: 1 }];      // the share picture: ?shoot=og&w=2400&h=1260
  const W = num("w", 1600), H = num("h", 1000);
  canvas.style.width = W / 2 + "px"; canvas.style.height = H / 2 + "px";
  world.resize(W / 2, H / 2, 2);
  (async () => {
    for (const s of shots) {
      const st = { u: s.u, night: s.night, head: [0, 0], gust: 0, time: 7.3, moonPhase: 0.62, slide: s.slide };
      for (let k = 0; k < 20; k++) world.render(st);            // let the flag, the fire and the raven settle
      const blob = await world.capture();
      await fetch("/__shot?name=" + s.name, { method: "POST", body: blob });
      hud.textContent = "saved " + s.name;
    }
    hud.textContent = "done: " + shots.length + " shots"; document.title = "shots done";
  })();
} else {
  const fixedT = q.has("t");
  const size = () => world.resize(innerWidth, innerHeight, Math.min(devicePixelRatio || 1, num("dpr", 2)));
  addEventListener("resize", size); size();
  addEventListener("keydown", (e) => { const d = e.shiftKey ? 0.25 : 0.03; if (e.key === "ArrowRight") S.u = Math.min(8, S.u + d); if (e.key === "ArrowLeft") S.u = Math.max(0, S.u - d); if (e.key === "n") S.night = S.night ? 0 : 1; });
  let drag = null;
  addEventListener("pointerdown", (e) => (drag = [e.clientX, e.clientY, S.head[0], S.head[1]]));
  addEventListener("pointermove", (e) => { if (drag) { S.head[0] = drag[2] + (e.clientX - drag[0]) * 0.004; S.head[1] = drag[3] - (e.clientY - drag[1]) * 0.004; } });
  addEventListener("pointerup", () => (drag = null));
  addEventListener("wheel", (e) => { S.u = Math.max(0, Math.min(8, S.u + e.deltaY * 0.0006)); });
  let last = performance.now(), n = 0;
  (function frame(now) {
    if (!fixedT) S.time = now / 1000;
    world.render(S);
    if (++n % 30 === 0) hud.textContent = `u ${S.u.toFixed(2)} ${STOP_IDS[Math.round(S.u)]}  ${world.w}x${world.h}  ${(1000 / (now - last)).toFixed(0)} fps`;
    last = now; requestAnimationFrame(frame);
  })(last);
}
</script></body></html>
